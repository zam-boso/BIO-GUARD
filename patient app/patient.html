<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com">
  <title>BIOGUARD AI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./patient.css">

  <!-- Supabase (bundled locally via npm install) -->
  <script src="node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">🧬 BIOGUARD AI</div>
    <div class="system-name">Clinical Decision-Support System</div>
    <div class="patient-id">Patient ID: <span id="patientId">demo123</span></div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="side-icon">🧠</div>
      <div class="side-icon">🧪</div>
      <div class="side-icon">🛡️</div>
      <div class="side-icon">⚙️</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

      <!-- OPTION CARDS -->
      <div class="card-container">

        <div class="card">
          <h3>OPTION 1</h3>
          <p>Current Infection</p>
          <button class="option-btn" data-option="Current Infection">Select</button>
        </div>

        <div class="card">
          <h3>OPTION 2</h3>
          <p>General Pathogen Check</p>
          <button class="option-btn" data-option="General Pathogen Check">Select</button>
        </div>

        <div class="card">
          <h3>OPTION 3</h3>
          <p>Resistance Analysis</p>
          <button class="option-btn" data-option="Resistance Analysis">Select</button>
        </div>

      </div>

      <!-- RAW DATA PANEL -->
      <div class="raw-panel">
        <h2>Patient Raw Data</h2>

        <div class="raw-box">

          <div class="raw-item">
            <span>Organism</span>
            <span id="rawOrganism">Pending</span>
          </div>

          <div class="raw-item">
            <span>ESBL</span>
            <span id="rawEsbl">Pending</span>
          </div>

          <div class="raw-item">
            <span>NDM-1</span>
            <span id="rawNdm">Pending</span>
          </div>

        </div>
      </div>

    </div>

    <!-- CHAT PANEL -->
    <div class="chat">

      <div class="chat-header">
        BIOGUARD AI Assistant
      </div>

      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-input">
        <input 
          id="chatInput" 
          type="text" 
          placeholder="Type your message..."
        >
        <button id="sendBtn">Send</button>
      </div>

    </div>

  </div>

  <!-- JS -->
  <script src="patient.js"></script>

</body>
</html>
